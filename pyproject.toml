[project]
name = "njupt-suan-api"
version = "0.1.3"
description = "API and MCP server for NJUPT infomation ~"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"

authors = [
    { name = "MangoFanFanw", email = "mangofanfanw@icloud.com" }
]

maintainers = [
    { name = "MangoFanFanw", email = "mangofanfanw@icloud.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "aiofiles>=25.1.0",
    "beautifulsoup4>=4.14.3",
    "ddddocr>=1.6.1",
    "fastapi>=0.136.1",
    "fastmcp>=3.2.0",
    "loguru>=0.7.3",
    "mcp>=1.27.0",
    "playwright>=1.58.0",
    "pydantic>=2.13.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.49",
    "sqlmodel>=0.0.38",
    "typer>=0.25.0",
    "uvicorn>=0.46.0",
    "watchfiles>=1.1.1",
    "websockets>=16.0",
]

[project.urls]
Homepage = "https://suan.mangofanfan.cn"
Documentation = "https://suan.mangofanfan.cn"
Repository = "https://github.com/mangofanfan/NJUPT-Suan-API.git"
Changelog = "https://github.com/mangofanfan/NJUPT-Suan-API/blob/master/CHANGELOG.md"
Issues = "https://github.com/mangofanfan/NJUPT-Suan-API/issues"

[project.scripts]
njupt-suan-api = "njupt_suan_api.manage:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
artifacts = ["src/njupt_suan_api/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/njupt_suan_api"]
artifacts = ["src/njupt_suan_api/static/**"]

[tool.ruff]
preview = true
line-length = 120

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C",
    "E",
    "F",
    "E",
    "Q",
    "I",
    "N",
    "W",
    "DOC",
    "RSE",
    "RET",
    "FAST",
    "YTT",
    "ANN",
    "ASYNC",
    "COM",
    "T20",
    "SIM",
    "PTH",
    "FLY",
    "RUF",
]

ignore = [
    "PTH123",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF029",
    "C90",
    "COM812",
]
